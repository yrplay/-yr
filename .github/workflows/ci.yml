name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "security/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run lint
      - name: Static security and deployment guardrails
        run: node scripts/verify-security.mjs
      - name: API integration checks
        run: bun scripts/test-api.ts
      - name: Build frontend and stage Vercel assets
        run: bun run build:vercel
