    <script>
      (function() {
        // 1. Intercept console.error to filter Vite HMR WebSocket connection messages
        var originalConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = (arg && (arg.message || arg.stack)) || String(arg);
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1) {
              return;
            }
          }
          return originalConsoleError.apply(console, arguments);
        };

        // 2. Intercept WebSocket if protocol is vite-hmr to prevent failed connection in sandbox
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && url.indexOf('vite-hmr') !== -1)) {
              var dummy = {
                addEventListener: function() {},
                removeEventListener: function() {},
                send: function() {},
                close: function() {},
                readyState: 1 // OPEN
              };
              return dummy;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
        }

        // 3. Catch unhandled errors
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('vite') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
